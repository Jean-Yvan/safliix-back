version: '3.8'

services:
  safliix-db:
    image: postgres
    container_name: safliix-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: marc
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sachrist
    networks:
      - sevencorp
    volumes:
      - postgres_data:/var/lib/postgresql/data

  safliix-redis:
    image: redis
    container_name: safliix-redis
    ports:
      - "6379:6379"
    networks:
      - sevencorp
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:safliix-redis:6379
    ports:
      - "8081:8081"
    networks:
      - sevencorp

networks:
  sevencorp:

volumes:
  postgres_data:
  redis_data:
